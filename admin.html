
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | KEERTHI TRAVELS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">KEERTHI <span>TRAVELS</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="buses.html">Buses</a>
        <a href="admin.html">Admin</a>
    </nav>
</header>

<section class="page-hero">
    <h1>Admin Dashboard</h1>
    <p>Manage your bus schedules.</p>
</section>

<section class="section">
    <h2>Add / Update Bus</h2>

    <form id="busForm" class="search-form">
        <input type="hidden" id="bus_id">

        <input type="text" id="bus_no" placeholder="Bus Number" required>
        <input type="text" id="source" placeholder="Source" required>
        <input type="text" id="destination" placeholder="Destination" required>
        <label>Departure Time</label>
        <input type="time" id="departure_time" required>
        <input type="number" id="total_seats" placeholder="Total Seats" min="1" required>
        <input type="number" id="fare" placeholder="Fare (₹)" min="0" step="0.01" required>

        <button type="submit">Save Bus</button>
        <button type="button" onclick="resetForm()">Clear Form</button>
    </form>

    <p id="adminMessage"></p>

    <h2>Bus Schedule Management</h2>
    <div id="busList" class="bus-results">Loading buses...</div>
</section>

<footer>
    <p>© 2026 KEERTHI TRAVELS | Created by Keerthi</p>
</footer>

<script>
const busForm = document.getElementById("busForm");
const busList = document.getElementById("busList");
const adminMessage = document.getElementById("adminMessage");

async function loadBuses() {
    try {
        const response = await fetch("/api/buses");
        const buses = await response.json();

        if (!response.ok) throw new Error(buses.error || "Unable to load buses");

        if (!buses.length) {
            busList.textContent = "No buses available.";
            return;
        }

        busList.innerHTML = "";

        buses.forEach(bus => {
            const card = document.createElement("div");
            card.className = "feature-card";

            const details = document.createElement("p");
            details.textContent =
                `${bus.bus_no}: ${bus.source} → ${bus.destination} | ` +
                `Departure: ${bus.departure_time} | Seats: ${bus.total_seats} | Fare: ₹${bus.fare}`;

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.type = "button";
            editButton.onclick = () => editBus(bus);

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.type = "button";
            deleteButton.onclick = () => deleteBus(bus.bus_id);

            card.append(details, editButton, deleteButton);
            busList.appendChild(card);
        });
    } catch (error) {
        busList.textContent = error.message;
    }
}

busForm.addEventListener("submit", async event => {
    event.preventDefault();

    const id = document.getElementById("bus_id").value;

    const bus = {
        bus_no: document.getElementById("bus_no").value,
        source: document.getElementById("source").value,
        destination: document.getElementById("destination").value,
        departure_time: document.getElementById("departure_time").value,
        total_seats: Number(document.getElementById("total_seats").value),
        fare: Number(document.getElementById("fare").value)
    };

    try {
        const response = await fetch(id ? `/api/buses/${id}` : "/api/buses", {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bus)
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to save bus");

        adminMessage.textContent = result.message || "Bus saved successfully!";
        resetForm();
        loadBuses();
    } catch (error) {
        adminMessage.textContent = error.message;
    }
});

function editBus(bus) {
    document.getElementById("bus_id").value = bus.bus_id;
    document.getElementById("bus_no").value = bus.bus_no;
    document.getElementById("source").value = bus.source;
    document.getElementById("destination").value = bus.destination;
    document.getElementById("departure_time").value = bus.departure_time;
    document.getElementById("total_seats").value = bus.total_seats;
    document.getElementById("fare").value = bus.fare;
    adminMessage.textContent = "Editing bus: " + bus.bus_no;
    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteBus(id) {
    if (!confirm("Are you sure you want to delete this bus?")) return;

    try {
        const response = await fetch(`/api/buses/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Delete failed");

        adminMessage.textContent = "Bus deleted successfully!";
        loadBuses();
    } catch (error) {
        adminMessage.textContent = error.message;
    }
}

function resetForm() {
    busForm.reset();
    document.getElementById("bus_id").value = "";
}

loadBuses();
</script>

</body>
</html>
